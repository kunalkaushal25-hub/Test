<!doctype html><html><head><meta charset="utf-8"><title>TrackToDeal Logo</title>
<style>
body{margin:0;background:#EEF2F7;font-family:Inter,Arial,sans-serif;color:#0A1F44;padding:40px}
h1{font-size:22px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1200px}
.card{background:#fff;border-radius:16px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.card.dark{background:#0A1F44;color:#9FB3D1}
.card small{font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.icons{display:flex;gap:28px;align-items:end}
.sw{display:flex;gap:12px}.sw div{width:120px;height:60px;border-radius:10px;color:#fff;font-size:12px;padding:8px;box-sizing:border-box}
</style></head><body>
<h1>TrackToDeal — logo concept</h1>
<div class="grid">
 <div class="card"><img src="logo-horizontal.svg" width="520"><small>Primary · horizontal</small></div>
 <div class="card dark"><img src="logo-horizontal-dark.svg" width="520"><small>Primary · on dark</small></div>
 <div class="card"><img src="logo-stacked.svg" width="340"><small>Stacked</small></div>
 <div class="card"><div class="icons"><img src="icon.svg" width="160"><img src="icon.svg" width="96"><img src="icon.svg" width="48"><img src="icon.svg" width="24"></div><small>App icon / favicon</small>
  <div class="sw"><div style="background:#0A1F44">Deal Navy<br>#0A1F44</div><div style="background:#14366B">Track Blue<br>#14366B</div><div style="background:#22C55E">Closed Green<br>#22C55E</div><div style="background:#5B6B85">Slate<br>#5B6B85</div></div></div>
</div></body></html>
