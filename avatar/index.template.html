<title>Aisha AI Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
  /* One look, after the product mock: the avatar lit on pure black, white
     type, the dock fading up out of the dark beneath her. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --ink: #f7f4ef;
    --muted: #a39d94;
    --glass: rgba(24, 22, 20, 0.72);
    --edge: rgba(255, 244, 228, 0.14);
    --sand: #d9c3a5;
    --sand-ink: #1b1611;
    --live: #8fd3a7;
    --font: "Montserrat", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  [hidden] { display: none !important; }
  .bare header, .bare #dock, .bare #fade { display: none; }
  body { font: 15px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }

  #app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Her bust dissolves into black above the dock, as in the mock. */
  #fade {
    position: absolute; left: 0; right: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 70%, #000 100%);
    transition: opacity 0.8s ease;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: grid; grid-template-columns: 48px 1fr 48px; align-items: center;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header h1 {
    margin: 0; text-align: center; font-weight: 600; font-size: 21px;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .round {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--edge); color: var(--ink);
    cursor: pointer; padding: 0;
  }
  .round:hover { background: rgba(255, 255, 255, 0.13); }
  .round svg { width: 20px; height: 20px; }
  .round.off { color: var(--muted); }

  #dock {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  #dock > * { width: 100%; max-width: 560px; }

  #caption {
    margin: 0; min-height: 2.9em; text-align: center; font-weight: 500;
    font-size: clamp(18px, 2.4vw + 10px, 24px); line-height: 1.3; text-wrap: balance;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
  }
  #you {
    margin: -6px 0 0; text-align: center; color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #status {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    min-height: 16px;
  }
  #status i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block;
    box-shadow: 0 0 10px var(--live);
  }
  #status[data-s="thinking"] i { background: var(--sand); box-shadow: 0 0 10px var(--sand); animation: pulse 1s infinite; }
  #status[data-s="speaking"] i { animation: pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #chips {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 2px 2px 4px; -webkit-mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 16px), transparent);
    mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 16px), transparent);
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 999px; font: 500 13px/1 var(--font); color: var(--ink);
    background: var(--glass); border: 1px solid var(--edge); cursor: pointer; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chip:first-child { margin-left: 14px; }
  .chip:last-child { margin-right: 14px; }
  .chip:hover { border-color: var(--sand); }
  .chip span { font-size: 15px; }

  #ask {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px;
    border-radius: 999px; background: var(--glass); border: 1px solid var(--edge);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #ask:focus-within { border-color: var(--sand); }
  #msg {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink);
    font: 400 15px/1.2 var(--font); padding: 10px 0;
  }
  #msg::placeholder { color: var(--muted); }
  #send { background: var(--sand); color: var(--sand-ink); border-color: transparent; }
  #send:hover { background: #e8d6bd; }

  #views {
    display: flex; justify-content: center; gap: 4px; font-size: 12px;
  }
  #views button {
    background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer;
    font: 500 12px/1 var(--font); letter-spacing: 0.06em; padding: 6px 10px; border-radius: 999px;
  }
  #views button[aria-pressed="true"] { color: var(--ink); border-color: var(--edge); }

  button:focus-visible, #msg:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

  #loading {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
    background: var(--bg); color: var(--muted); font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; transition: opacity 0.6s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }

  @media (max-height: 640px) {
    #views { display: none; }
    #dock { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #fade, #loading { transition: none; }
    #status i { animation: none !important; }
  }
</style>

<div id="app">
  <canvas id="gl" aria-label="Aisha, your 3D assistant"></canvas>
  <div id="fade"></div>

  <header>
    <button class="round" id="back" type="button" aria-label="Start over" title="Start over">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="name">Aisha</h1>
    <button class="round" id="mute" type="button" aria-label="Turn voice off" title="Voice on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>

  <section id="dock">
    <p id="caption" aria-live="polite"></p>
    <p id="you" hidden></p>
    <div id="status" data-s="idle"><i></i><span>Online</span></div>
    <div id="chips" role="toolbar" aria-label="Gestures"></div>
    <form id="ask" autocomplete="off">
      <input id="msg" name="msg" type="text" placeholder="Ask Aisha anything…" aria-label="Message Aisha" maxlength="400">
      <button class="round" id="mic" type="button" aria-label="Speak to Aisha" title="Speak" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="round" id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div id="views" role="group" aria-label="Framing">
      <button type="button" data-v="portrait" aria-pressed="true">Portrait</button>
      <button type="button" data-v="half" aria-pressed="false">Half body</button>
      <button type="button" data-v="full" aria-pressed="false">Full body</button>
    </div>
  </section>

  <div id="loading">Getting Aisha ready</div>
</div>

<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
